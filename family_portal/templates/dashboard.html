<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的空间 · 家人门户</title>
<style>
:root{--bg:#0b1220;--card:#16233a;--card2:#1c2c47;--line:#2b3d5c;--tx:#e8eef7;--mut:#8da0bb;--acc:#5eb3ff;--acc2:#7c7cf0;--ok:#37d39a}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:
 radial-gradient(1200px 600px at 85% -10%,rgba(124,124,240,.10),transparent 60%),
 radial-gradient(1000px 500px at -10% 10%,rgba(94,179,255,.10),transparent 55%),
 var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:18px 20px 40px}
.top{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.2px}
.brand .lg{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#5eb3ff,#7c7cf0);font-size:15px;box-shadow:0 4px 14px rgba(94,179,255,.35)}
.brand small{color:var(--mut);font-weight:500}
.top a{color:var(--mut);text-decoration:none;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid transparent}
.top a:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.hero{display:flex;align-items:center;gap:18px;margin:30px 0 12px;
 background:linear-gradient(135deg,rgba(94,179,255,.10),rgba(124,124,240,.08));
 border:1px solid var(--line);border-radius:20px;padding:22px 24px;max-width:640px}
.ava{width:64px;height:64px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#5eb3ff,#7c7cf0);color:#fff;font-size:28px;font-weight:800;
 box-shadow:0 8px 24px rgba(124,124,240,.35)}
.hero h1{font-size:22px}
.hero h1 span{color:var(--acc)}
.hero p{color:var(--mut);font-size:14px;margin-top:4px}
.sect{display:flex;align-items:center;gap:8px;margin:28px 0 14px;color:var(--mut);font-size:13px;letter-spacing:.4px;text-transform:uppercase}
.sect::after{content:"";height:1px;flex:1;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;text-decoration:none;color:inherit;
 display:flex;align-items:flex-start;gap:14px;padding:18px;transition:.18s;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.18s}
.card:hover{transform:translateY(-3px);border-color:#3b5290;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.card:hover::before{background:var(--tc)}
.tico{width:52px;height:52px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.card .bd{flex:1;min-width:0}
.card .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.card .nm .go{margin-left:auto;color:var(--mut);font-size:16px;opacity:0;transition:.18s}
.card:hover .nm .go{opacity:1}
.card .ds{color:var(--mut);font-size:13px;margin-top:6px;line-height:1.5}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:34px;opacity:.75}
@media(max-width:560px){.hero{flex-direction:row;padding:16px}.hero h1{font-size:19px}.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
  <div class="top"><span class="brand"><span class="lg">🏠</span> 家人门户 <small>Family Hub</small></span>
    <a href="/family/logout">退出登录</a></div>

  <div class="hero">
    <div class="ava">{{ (user[:1] if user else '?')|upper }}</div>
    <div>
      <h1>你好，<span>{{ user }}</span> 👋</h1>
      <p>今天想用点什么？家人门户已为你准备好专属服务。</p>
    </div>
  </div>

  <div class="sect">我的服务</div>
  <div class="grid">
    <a class="card" style="--tc:#37d39a" href="/family/drive/">
      <span class="tico" style="background:rgba(55,211,154,.14)">🗂️</span>
      <span class="bd"><span class="nm">我的云盘 <i class="go">›</i></span>
        <span class="ds">专属文件空间，只属于你的私人文件</span></span>
    </a>
    <a class="card" style="--tc:#ff9d5c" href="/family/menu" target="_blank">
      <span class="tico" style="background:rgba(255,157,92,.14)">🍳</span>
      <span class="bd"><span class="nm">点餐 <i class="go">›</i></span>
        <span class="ds">今天想吃什么？点好大厨就开做</span></span>
    </a>
    <a class="card" style="--tc:#7c7cf0" href="/family/desktop">
      <span class="tico" style="background:rgba(124,124,240,.15)">🖥️</span>
      <span class="bd"><span class="nm">我的桌面 <i class="go">›</i></span>
        <span class="ds">属于你的独立远程桌面</span></span>
    </a>
  </div>

  <div class="foot">🏠 家人门户 · 登录账号才能解锁各自空间</div>
</div>
</body></html>
