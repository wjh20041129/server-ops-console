function cet4DrawCurve() {
    var canvas = document.getElementById('cet4CurveCanvas');
    if (!canvas) return;
    var dpr = window.devicePixelRatio || 1;
    var cssW = canvas.clientWidth || window.innerWidth - 32;
    var cssH = 560;  // 竖版高度
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.height = cssH + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    
    var w = cssW, h = cssH;
    var padL = 34, padR = 14, padT = 16, padB = 30;
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var xMax = 16, yMax = 110;
    function X(x) { return padL + (x / xMax) * plotW; }
    function Y(y) { return padT + (1 - y / yMax) * plotH; }
    
    // 网格线
    ctx.strokeStyle = '#eef0f4'; ctx.lineWidth = 1;
    for (var i = 0; i <= 4; i++) {
        var yy = padT + (i / 4) * plotH;
        ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
    }
    // Y轴标签
    ctx.fillStyle = '#8a93a7'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    for (var i = 0; i <= 2; i++) {
        var val = 100 - i * 40;
        ctx.fillText(val + '%', padL - 5, Y(val) + 4);
    }
    // X轴标签
    ctx.textAlign = 'center';
    [1, 2, 4, 7, 15].forEach(function(d) {
        ctx.fillText(d + '天', X(d), h - 8);
    });
    ctx.fillText('0', X(0), h - 8);
    
    // 遗忘曲线（不复习，灰色虚线）
    var pts = [[0, 100], [0.33, 58.2], [1, 44.2], [2, 35.8], [4, 33.7], [7, 27.8], [15, 25.4]];
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.8; ctx.setLineDash([5, 4]);
    ctx.beginPath();
    pts.forEach(function(p, i) { i === 0 ? ctx.moveTo(X(p[0]), Y(p[1])) : ctx.lineTo(X(p[0]), Y(p[1])); });
    ctx.stroke(); ctx.setLineDash([]);
    
    // 复习保持曲线（蓝色实线，阶梯：每次复习回到100%）
    var reviewPts = [0.33, 1, 2, 4, 7, 15];
    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(X(0), Y(100));
    reviewPts.forEach(function(d) {
        ctx.lineTo(X(d), Y(100));
    });
    ctx.stroke();
    // 复习点标记
    var labels = {0.33: '20分', 1: '1天', 2: '2天', 4: '4天', 7: '7天', 15: '15天'};
    reviewPts.forEach(function(d) {
        var px = X(d), py = Y(100);
        ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#10b981'; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#3d4a5e'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        // 20分钟和0天太近，标签放蓝点下方
        if (d === 0.33) {
            ctx.fillText(labels[d], px, py + 16);
        } else {
            ctx.fillText(labels[d], px, py - 8);
        }
    });
    
    // 我的单词点：基于数据库 last_study_time 计算位置（服务器重启不影响）
    // X = 距上次复习天数, Y = 记忆保持率（按遗忘曲线分段衰减模型）
    var now = new Date();
    var wordPts = [];
    cet4CurveWords.forEach(function(w) {
        if (!w.last_study_time) return;
        var t = new Date(w.last_study_time.replace(/-/g, '/'));
        if (isNaN(t.getTime())) return;
        var days = (now - t) / 86400000;
        var keep;
        if (days <= 0.33) keep = 100 - (100 - 58.2) * (days / 0.33);
        else if (days <= 1) keep = 58.2 - (58.2 - 44.2) * ((days - 0.33) / 0.67);
        else if (days <= 2) keep = 44.2 - (44.2 - 35.8) * ((days - 1) / 1);
        else if (days <= 4) keep = 35.8 - (35.8 - 33.7) * ((days - 2) / 2);
        else if (days <= 7) keep = 33.7 - (33.7 - 27.8) * ((days - 4) / 3);
        else if (days <= 15) keep = 27.8 - (27.8 - 25.4) * ((days - 7) / 8);
        else keep = 25.4 - (days - 15) * 0.3;
        keep = Math.max(5, keep);
        wordPts.push({x: Math.min(days, xMax), y: keep, w: w});
    });
    
    // 绘制单词点（红色，点击查看详情）
    wordPts.forEach(function(p) {
        var px = X(p.x), py = Y(p.y);
        ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444'; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    });
    // 选中态：如果之前选中过某词，画辅助虚线（垂直到X轴）+ 时间标注
    if (cet4CurveSelected) {
        var sel = null;
        wordPts.forEach(function(p) { if (p.w.id === cet4CurveSelected.id) sel = p; });
        if (sel) {
            var sx = X(sel.x), sy = Y(sel.y);
            // 垂直虚线到X轴
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 3]);
            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, h - padB + 6); ctx.stroke();
            ctx.setLineDash([]);
            // 水平虚线到Y轴
            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(padL, sy); ctx.stroke();
            // 时间标注（红点上方）
            var days = cet4CurveSelected._days;
            var timeStr;
            if (days < 1) {
                var hrs = Math.max(1, Math.round(days * 24));
                timeStr = hrs + ' 小时前';
            } else {
                timeStr = days.toFixed(1) + ' 天前';
            }
            ctx.fillStyle = '#ef4444'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(timeStr, sx, sy - 14);
            // 选中点放大显示
            ctx.beginPath(); ctx.arc(sx, sy, 12, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(239,68,68,0.25)'; ctx.fill();
            ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        }
    }
    
    // 点击单词点显示详情；点空白显示最近的单词列表
    canvas.onclick = function(e) {
        var rect = canvas.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var my = e.clientY - rect.top;
        var found = null;
        var near = [];
        wordPts.forEach(function(p) {
            var px = X(p.x), py = Y(p.y);
            if (Math.abs(mx - px) < 22 && Math.abs(my - py) < 22) {
                found = p.w;
            } else if (Math.abs(mx - px) < 40 && Math.abs(my - py) < 40) {
                near.push(p.w);
            }
        });
        var info = document.getElementById('cet4CurveWordInfo');
        if (found) {
            // 记录选中词和时间，重绘显示辅助虚线
            var selP = null;
            wordPts.forEach(function(p) { if (p.w.id === found.id) selP = p; });
            cet4CurveSelected = found;
            if (selP) {
                cet4CurveSelected._days = selP.x;
                cet4DrawCurve();
            }
            var stage = found.ebbinghaus_stage || 0;
            var nextT = found.next_review_time ? new Date(found.next_review_time.replace(/-/g, '/')) : null;
            var nextStr = nextT && !isNaN(nextT.getTime()) ? nextT.toLocaleDateString('zh-CN') : '无';
            // 距上次学习时间
            var daysAgo = selP ? selP.x : 0;
            var agoStr;
            if (daysAgo < 1) {
                var hrs = Math.max(1, Math.round(daysAgo * 24));
                agoStr = hrs + ' 小时前';
            } else {
                agoStr = daysAgo.toFixed(1) + ' 天前';
            }
            info.style.display = 'block';
            info.innerHTML = `
                <div class="wi-word">${found.word} <span style="font-size:12px;color:#8a93a7;font-weight:400;">${found.phonetic || ''}</span></div>
                <div class="wi-meta">${found.meaning || ''}</div>
                <div class="wi-meta"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;color:#8a93a7;"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 13.5"/></svg>距上次学习：<b style="color:#ef4444;">${agoStr}</b></div>
                <div class="wi-meta">艾宾浩斯阶段：${stage}/5 ${stage >= 5 ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><polyline points="20 6 9 17 4 12"/></svg> 已完成' : ''}</div>
                <div class="wi-meta">下次复习：${nextStr}</div>`;
        } else if (near.length > 0) {
            // 附近有单词但没点中：显示列表
            info.style.display = 'block';
            var listHtml = near.map(function(w) {
                var st = w.ebbinghaus_stage || 0;
                return `<div class="cet4-word-item" style="cursor:pointer;" onclick="cet4CurveShowWord(${w.id})">
                    <span class="w-word">${w.word}</span>
                    <span style="color:#f59e0b;font-size:12px;">阶段${st}/5</span>
                    <span class="w-meaning">${w.meaning || ''}</span>
                </div>`;
            }).join('');
            info.innerHTML = `<div style="font-size:13px;color:#8a93a7;margin-bottom:6px;">附近 ${near.length} 个单词：</div><div class="cet4-word-list">${listHtml}</div>`;
        } else {
            // 点空白：显示整条曲线上最近的 3 个单词
            var best = null, bestDist = 1e9;
            wordPts.forEach(function(p) {
                var px = X(p.x), py = Y(p.y);
                var d = Math.sqrt((mx-px)*(mx-px) + (my-py)*(my-py));
                if (d < bestDist) { bestDist = d; best = p.w; }
            });
            if (best) {
                var st2 = best.ebbinghaus_stage || 0;
                var nt = best.next_review_time ? new Date(best.next_review_time.replace(/-/g, '/')) : null;
                var ns = nt && !isNaN(nt.getTime()) ? nt.toLocaleDateString('zh-CN') : '无';
                info.style.display = 'block';
                info.innerHTML = `
                    <div style="font-size:13px;color:#8a93a7;margin-bottom:6px;">最近的单词：</div>
                    <div class="cet4-word-item" style="cursor:pointer;" onclick="cet4CurveShowWord(${best.id})">
                        <span class="w-word">${best.word}</span>
                        <span style="color:#f59e0b;font-size:12px;">阶段${st2}/5</span>
                        <span class="w-meaning">${best.meaning || ''}</span>
                    </div>
                    <div class="wi-meta">下次复习：${ns}</div>`;
            } else {
                info.style.display = 'none';
            }
        }
    };
}

// 曲线页点击单词列表项 → 显示详情
function cet4CurveShowWord(wordId) {
    var found = null;
    cet4CurveWords.forEach(function(w) { if (w.id === wordId) found = w; });
    if (!found) return;
    // 同步选中态（画辅助虚线）
    var selP = null;
    var nowT = new Date();
    var t = found.last_study_time ? new Date(found.last_study_time.replace(/-/g, '/')) : null;
    if (t && !isNaN(t.getTime())) {
        var days = (nowT - t) / 86400000;
        selP = {x: Math.min(days, 16)};
        cet4CurveSelected = found;
        cet4CurveSelected._days = days;
        cet4DrawCurve();
    }
    var info = document.getElementById('cet4CurveWordInfo');
    var stage = found.ebbinghaus_stage || 0;
    var nextT = found.next_review_time ? new Date(found.next_review_time.replace(/-/g, '/')) : null;
    var nextStr = nextT && !isNaN(nextT.getTime()) ? nextT.toLocaleDateString('zh-CN') : '无';
    var daysAgo = cet4CurveSelected ? cet4CurveSelected._days : 0;
    var agoStr;
    if (daysAgo < 1) {
        var hrs = Math.max(1, Math.round(daysAgo * 24));
        agoStr = hrs + ' 小时前';
    } else {
        agoStr = daysAgo.toFixed(1) + ' 天前';
    }
    info.innerHTML = `
        <div class="wi-word">${found.word} <span style="font-size:12px;color:#8a93a7;font-weight:400;">${found.phonetic || ''}</span></div>
        <div class="wi-meta">${found.meaning || ''}</div>
        <div class="wi-meta"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px;color:#8a93a7;"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 13.5"/></svg>距上次学习：<b style="color:#ef4444;">${agoStr}</b></div>
        <div class="wi-meta">艾宾浩斯阶段：${stage}/5 ${stage >= 5 ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><polyline points="20 6 9 17 4 12"/></svg> 已完成' : ''}</div>
        <div class="wi-meta">下次复习：${nextStr}</div>`;
}

function cet4OpenLearnedPage() {

    ['cet4LearnedPanel', 'cet4WrongBookPanel', 'cet4ReviewPanel'].forEach(function(pid) {

function cet4LoadLearned() {
    var search = document.getElementById('cet4LearnedSearch').value;
    var filter = document.getElementById('cet4LearnedFilter').value;
    var url = '/api/cet4/learned/list?search=' + encodeURIComponent(search) + '&filter=' + filter;
    fetchWithSession(url)
        .then(r => r.json())
        .then(data => {
            var list = document.getElementById('cet4LearnedList');
            if (data.words.length === 0) {
                list.innerHTML = '<div class="cet4-empty">暂无已学单词</div>';
                return;
            }
            list.innerHTML = `<div class="cet4-word-list">` + data.words.map(w => `
                <div class="cet4-word-item" onclick="cet4ReviewWord(${w.id})">
                    <span class="w-word">${w.word}</span>
                    <span class="w-meaning">${w.meaning}</span>
                </div>`).join('') + `</div>
                <div style="text-align:center;color:#8a93a7;font-size:12px;margin-top:8px;">共 ${data.total} 个单词</div>`;
        });
}

function cet4ShowWordById(wordId) {
    // 搜索栏点击单词：复用 ReviewWord 的查看逻辑
    cet4ReviewWord(wordId);
}

function cet4ReviewWord(wordId) {
    fetchWithSession('/api/cet4/word/ai?word_id=' + wordId)
        .then(r => r.json())
        .then(d => {
            if (d.error) { alert('加载失败'); return; }
            var w = {id: wordId, word: d.word, phonetic: d.phonetic || '', meaning: d.meaning || d.detail || '', ai_example: d.example, ai_memorytip: d.memorytip, ai_detail: d.detail};
            // 保存当前学习状态，进入查阅模式
            cet4State.savedStudy = {
                groupId: cet4State.groupId,
                groupWords: cet4State.groupWords,
                groupIndex: cet4State.groupIndex,
                processedIds: cet4State.processedIds,
                currentWord: cet4State.currentWord
            };
            cet4State.browsing = true;
            var onlyNew = document.getElementById('cet4OnlyNew');
            if (onlyNew) onlyNew.checked = false;
            cet4State.currentWord = w;
            cet4State.groupWords = [w];
            cet4State.groupIndex = 0;
            cet4State.processedIds = {};
            document.getElementById('cet4WordCard').style.display = 'block';
            document.getElementById('cet4Study').style.display = 'none';
            cet4RenderCard();
        });
}

function cet4BackToStudy() {
    // 返回学习：恢复保存的学习状态（不重新请求，保持原顺序）
    var saved = cet4State.savedStudy;
    // 关闭只刷生词开关（如果开着）
    var onlyNew = document.getElementById('cet4OnlyNew');
    if (onlyNew) onlyNew.checked = false;
    if (saved && saved.groupId) {
        cet4State.groupId = saved.groupId;
        cet4State.groupWords = saved.groupWords;
        cet4State.groupIndex = saved.groupIndex;
        cet4State.processedIds = saved.processedIds;
        cet4State.currentWord = saved.currentWord;
        cet4State.browsing = false;
        cet4State.reviewMode = false;
        cet4State.pendingReviewIds = saved.pendingReviewIds || {};
        // 恢复按钮
        var actions = document.querySelector('.cet4-actions');
        actions.innerHTML = `
            <button class="btn btn-success" onclick="cet4Mark(true)"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 认识</button>
            <button class="btn btn-danger" onclick="cet4Mark(false)"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 不认识</button>`;
        
        // 直接显示保存位置的单词，保持原顺序
        if (cet4State.groupWords.length > 0) {
            var idx = saved.groupIndex >= 0 ? saved.groupIndex : 0;
            if (idx >= cet4State.groupWords.length) idx = cet4State.groupWords.length - 1;
            document.getElementById('cet4Study').style.display = 'none';
            document.getElementById('cet4WordCard').style.display = 'block';
            cet4ShowWordByIndex(idx);
        } else {
            document.getElementById('cet4Study').style.display = 'block';
            document.getElementById('cet4WordCard').style.display = 'none';
        }
        cet4LoadStatus();
    } else {
        // 没有保存的学习状态，回到首页状态
        cet4State.browsing = false;
        document.getElementById('cet4WordCard').style.display = 'none';
        document.getElementById('cet4Study').style.display = 'block';
        cet4LoadStatus();
    }
}

/* ========== 新交互：枢纽与动态动作按钮 ========== */
function cet4UpdateHub(data) {
    var PLAY = '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg> ';
    var tip = document.getElementById('cet4HubTip');
    var btn = document.getElementById('cet4HubStartBtn');
    var wb = document.getElementById('cet4HubWrongBtn');
    if (!tip || !btn) return;
    var g = data.current_group;
    if (g && parseInt(g.remaining) > 0) {
        tip.innerHTML = "第" + g.group_id + "组：已学 <b style=\"color:#10b981;\">" + g.learned + "</b>/" + g.total + " · 还剩 " + g.remaining + " 个";
        btn.innerHTML = PLAY + '继续刷这一组';
    } else if (g) {
        tip.innerHTML = '第' + g.group_id + '组已全部学完，可以继续下一组';
        btn.innerHTML = PLAY + '开启下一组20词';
    } else {
        tip.innerHTML = data.pending_total > 0 ? ('还有 ' + data.pending_total + ' 个单词待学习') : '全部单词已完成 🎉';
        btn.innerHTML = PLAY + '开启第一组20词';
    }
    if (wb) wb.style.display = (g && parseInt(g.learned) > 0) ? 'flex' : 'none';
}

function cet4HubStart() {
    if (!cet4State.groupId) { cet4CreateGroup(); return; }
    fetchWithSession('/api/cet4/group/status')
        .then(r => r.json())
        .then(st => {
            if (!st.current_group || parseInt(st.current_group.remaining) <= 0) cet4CreateGroupNew();
            else cet4ResumeGroup(cet4State.groupId);
        })
        .catch(() => cet4ResumeGroup(cet4State.groupId));
}

function cet4UpdateMarkedUI() {
    var actions = document.querySelector('.cet4-actions');
    if (!actions) return;
    var w = cet4State.currentWord;
    if (!w) return;
    var svgOk = '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    var svgNo = '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    var tools = document.getElementById('cet4Tools');
    var cutRow = document.getElementById('cet4CutRow');
    // 只要在看单词，就提供“斩”按钮（各模式一致）
    if (cutRow) cutRow.style.display = w.is_cut ? 'none' : 'block';
    if (cet4State.reviewMode) {
        if (tools) tools.style.display = 'none';
        actions.innerHTML = '<button class="btn btn-success" onclick="cet4ReviewMark(true)">' + svgOk + ' 认识</button>' +
            '<button class="btn btn-danger" onclick="cet4ReviewMark(false)">' + svgNo + ' 不认识</button>';
        return;
    }
    var marked = !!cet4State.processedIds[w.id] || !!(cet4State.pendingReviewIds && cet4State.pendingReviewIds[w.id]);
    if (tools) tools.style.display = marked ? 'flex' : 'none';
    if (!marked) {
        actions.innerHTML = '<button class="btn btn-success" onclick="cet4Mark(true)">' + svgOk + ' 认识</button>' +
            '<button class="btn btn-danger" onclick="cet4Mark(false)">' + svgNo + ' 不认识</button>';
    } else if (marked && cet4State.browsing) {
        var hasNext = cet4State.groupWords.some(function(x) {
            return !cet4State.processedIds[x.id] && !(cet4State.pendingReviewIds && cet4State.pendingReviewIds[x.id]);
        });
        actions.innerHTML = hasNext ? '<button class="btn btn-primary" style="flex:1;" onclick="cet4NextWord()">下一个词 →</button>'
            : '<button class="btn btn-primary" style="flex:1;" onclick="cet4BrowseFinish()">完成 · 返回</button>';
    } else {
        actions.innerHTML = '<button class="btn btn-primary" style="flex:1;" onclick="cet4NextWord()">下一个词 →</button>';
    }
}

function cet4BrowseFinish() {
    if (cet4State.savedStudy && cet4State.groupWords.length > 1) { cet4BackToStudy(); return; }
    cet4State.browsing = false;
    cet4State.reviewMode = false;
    cet4State.currentWord = null;
    document.getElementById('cet4WordCard').style.display = 'none';
    document.getElementById('cet4Study').style.display = 'block';
    cet4LoadStatus();
}

/* ========== 今日待复习（艾宾浩斯） ========== */
function cet4ShowReview() {
    // 隐藏其他面板，只显示待复习
    document.getElementById('cet4LearnedPanel').style.display = 'none';
    document.getElementById('cet4WrongBookPanel').style.display = 'none';
    var panel = document.getElementById('cet4ReviewPanel');
    panel.style.display = 'block';
    panel.innerHTML = '<h3 style="font-size:16px;margin-bottom:10px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 今日待复习（艾宾浩斯）</h3><div class="cet4-empty">加载中...</div>';
    // 滚动到复习面板，确保用户看到结果
    setTimeout(function() { panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
    fetchWithSession('/api/cet4/review/today_list')
        .then(r => r.json())
        .then(data => {
            if (data.words.length === 0) {
                panel.innerHTML = '<h3 style="font-size:16px;margin-bottom:10px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 今日待复习（艾宾浩斯）</h3><div class="cet4-empty">暂无需要复习的单词</div>';
                return;
            }
            panel.innerHTML = `<h3 style="font-size:16px;margin-bottom:10px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 今日待复习（艾宾浩斯）</h3>
                <div class="cet4-word-list">` + data.words.map(w => `
                <div class="cet4-word-item" onclick="cet4StartReview(${w.id})">
                    <span class="w-word">${w.word}</span>
                    <span style="color:#f59e0b;font-size:12px;">阶段${w.ebbinghaus_stage}/5</span>
                    <span class="w-meaning">${w.meaning}</span>

}

function cet4StartReview(wordId) {
    fetchWithSession('/api/cet4/review/today_list')
        .then(r => r.json())
        .then(d => {
            var w = d.words.find(x => x.id === wordId);
            if (!w) { alert('该单词不在待复习列表'); return; }
            cet4StartReviewWithList(d.words, w.id);
        });
}

function cet4StartReviewWithList(words, startId, resetProcessed) {
    if (!words || !words.length) { alert('没有待复习单词'); return; }
    var startIdx = 0;
    for (var i = 0; i < words.length; i++) {
        if (words[i].id === startId) { startIdx = i; break; }
    }
    var w = words[startIdx];
    w.ai_detail = w.meaning;
    // 保存当前学习状态
    cet4State.savedStudy = {
        groupId: cet4State.groupId,
        groupWords: cet4State.groupWords,
        groupIndex: cet4State.groupIndex,
        processedIds: cet4State.processedIds,
        currentWord: cet4State.currentWord
    };
    cet4State.browsing = true;
    var onlyNew2 = document.getElementById('cet4OnlyNew');
    if (onlyNew2) onlyNew2.checked = false;
    cet4State.currentWord = w;
    cet4State.groupWords = words;
    cet4State.groupIndex = startIdx;
    // 仅在初次进入复习时清空已处理标记；复习推进(标记后切下一个)时保留，避免死循环
    if (resetProcessed !== false) {
        cet4State.processedIds = {};
    }
    cet4State.reviewMode = true;
    document.getElementById('cet4WordCard').style.display = 'block';
    document.getElementById('cet4Study').style.display = 'none';
    cet4RenderCard();
}

function cet4ReviewMark(known) {
    var w = cet4State.currentWord;
    if (!w) return;
    fetchWithSession('/api/cet4/review/mark', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({word_id: w.id, known: known})
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { showToast(data.error, 'error'); return; }
        if (data.done) {
            showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg> 该单词艾宾浩斯全部阶段完成！', 'success');
        } else if (known) {
            showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><polyline points="20 6 9 17 4 12"/></svg> 已进入第' + data.stage + '阶段，下次复习: ' + data.next_review, 'success');
        } else {
            showToast('24 小时后可再复习本阶段', 'warn');
        }
        // 标记成功 → 遗忘曲线数据已变，清空曲线缓存，下次打开重新拉最新
        cet4CurveWords = [];
        // 连续模式：自动加载下一个待复习单词
        cet4State.processedIds[w.id] = true;
        var nextIdx = -1;
        for (var i = 0; i < cet4State.groupWords.length; i++) {
            if (!cet4State.processedIds[cet4State.groupWords[i].id]) {
                nextIdx = i;
                break;
            }
        }
        cet4LoadStatus();
        if (nextIdx >= 0) {
            // 复习中推进：保留 processedIds，避免清空后死循环
            cet4StartReviewWithList(cet4State.groupWords, cet4State.groupWords[nextIdx].id, false);
        } else {
            // 全部复习完，回枢纽
            cet4State.currentWord = null;
            cet4State.reviewMode = false;
            cet4State.browsing = false;
            document.getElementById('cet4WordCard').style.display = 'none';
            document.getElementById('cet4Study').style.display = 'block';
            cet4ShowReview();
            showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg> 今日复习全部完成！', 'success');
        }
    });
}

// ============================================================
//  每日练习功能
// ============================================================
var dailyQuestionIndex = 0;  // 单题模式：当前题索引

function loadDailyPractice() {
    fetchWithSession('/api/daily/practice')
        .then(r => r.json())
        .then(data => {
            if (data.total === 0) {
                document.getElementById('dailyQuestionsList').innerHTML = '<p style="color:#8a93a7;text-align:center;">暂无今日题目，请点击"生成今日题目"</p>';
            } else {
                window.dailyQuestions = data.questions;
                dailyQuestionIndex = 0;
                renderDailyQuestions(data.questions);
                renderDailyStats(data.answered, data.correct, data.total);
            }
        });
}

function generateDailyQuestions() {
    const statusEl = document.getElementById('dailyStatus');
    statusEl.textContent = '正在生成题目...';
    statusEl.style.color = '#8a93a7';
    
    fetchWithSession('/api/daily/generate', {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                statusEl.textContent = data.error;
                statusEl.style.color = '#ef4444';
            } else {
                statusEl.textContent = data.message;
                statusEl.style.color = '#10b981';
                loadDailyPractice();
            }
        })
        .catch(err => {
            statusEl.textContent = '生成失败: ' + err.message;
            statusEl.style.color = '#ef4444';
        });
}

function renderDailyQuestions(questions) {
    const container = document.getElementById('dailyQuestionsList');
    // 单题模式：只渲染当前题
    const q = questions[dailyQuestionIndex];
    if (!q) {
        container.innerHTML = '<p style="color:#8a93a7;text-align:center;">暂无题目</p>';
        return;
    }
    
    const answered = q.user_answer !== null;
    const isCorrect = q.is_correct === 1;
    
    let html = `<div class="quiz-question-box" style="margin-bottom:16px;">
        <div class="q-title" style="display:flex;justify-content:space-between;">
            <span>题目 ${dailyQuestionIndex + 1} / ${questions.length}</span>
            ${answered && isCorrect ? '<span style="color:#10b981;font-size:13px;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已答对</span>' : (answered ? '<span style="color:#ef4444;font-size:13px;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 已答错</span>' : '')}
        </div>
        <div class="q-text">${q.question}</div>
        <div style="margin-top:12px;">`;
    
    q.options.forEach(opt => {
        const optLetter = opt.substring(0, 1);
        let btnClass = 'btn btn-outline';
        let disabled = '';
        
        if (answered) {
            disabled = 'disabled';
            if (optLetter === q.answer) {
                btnClass = 'btn btn-success';
            } else if (optLetter === q.user_answer && !isCorrect) {
                btnClass = 'btn btn-danger';
            }
        }
        
        html += `<button class="${btnClass}" style="margin:4px;width:100%;justify-content:flex-start;text-align:left;" ${disabled} onclick="submitDailyAnswer(${q.id}, '${optLetter}')">${opt}</button>`;
    });
    
    html += '</div>';
    
    if (answered) {
        html += `<div style="margin-top:12px;padding:10px;background:#f0f4fe;border-radius:8px;">`;
        if (isCorrect) {
            html += '<span style="color:#10b981;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 回答正确!</span>';
        } else {
            html += `<span style="color:#ef4444;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 回答错误，正确答案是 ${q.answer}</span>`;
        }
        if (q.explanation) {
            html += `<div style="margin-top:8px;color:#5a6a7e;font-size:14px;">${q.explanation}</div>`;
        }
        html += '</div>';
        
        // 已答：显示下一题按钮（或完成）
        if (dailyQuestionIndex < questions.length - 1) {
            html += `<div style="margin-top:12px;text-align:center;">
                <button class="btn btn-primary btn-block" onclick="nextDailyQuestion()"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg> 下一题</button>
            </div>`;
        } else {
            html += `<div style="margin-top:12px;text-align:center;color:#10b981;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg> 今日题目全部完成！</div>`;
        }
    }
    
    // 未答时也显示导航（可回看已答）
    if (!answered) {
        html += `<div class="quiz-nav" style="margin-top:12px;">
            <button class="btn btn-outline" ${dailyQuestionIndex === 0 ? 'disabled' : ''} onclick="prevDailyQuestion()"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> 上一题</button>
            <span class="quiz-progress">${dailyQuestionIndex + 1} / ${questions.length}</span>
            <button class="btn btn-outline" ${dailyQuestionIndex >= questions.length - 1 ? 'disabled' : ''} onclick="nextDailyQuestion()">下一题 <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>`;
    }
    
    container.innerHTML = html;
}

// 每日练习：上一题/下一题
function prevDailyQuestion() {
    if (dailyQuestionIndex > 0) {
        dailyQuestionIndex--;
        renderDailyQuestions(window.dailyQuestions || []);
    }
}

function nextDailyQuestion() {
    if (dailyQuestionIndex < (window.dailyQuestions || []).length - 1) {
        dailyQuestionIndex++;
        renderDailyQuestions(window.dailyQuestions || []);
    }
}

function renderDailyStats(answered, correct, total) {
    const accuracy = total > 0 ? (correct / total * 100).toFixed(1) : 0;
    document.getElementById('dailyStats').innerHTML = `
        <h3 style="font-size:16px;margin-bottom:8px;">今日进度</h3>
        <div style="display:flex;gap:20px;">
            <div><span style="color:#8a93a7;">已完成:</span> <strong>${answered}/${total}</strong></div>
            <div><span style="color:#8a93a7;">正确数:</span> <strong style="color:#10b981;">${correct}</strong></div>
            <div><span style="color:#8a93a7;">正确率:</span> <strong>${accuracy}%</strong></div>
        </div>
    `;
}

function submitDailyAnswer(questionId, answer) {
    fetchWithSession('/api/daily/answer', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question_id: questionId, answer: answer})
    })
    .then(r => r.json())
    .then(data => {
        // 更新本地题单状态（不重新加载，保持当前题索引）
        const qs = window.dailyQuestions || [];
        const q = qs.find(x => x.id === questionId);
        if (q) {
            q.user_answer = answer;
            q.is_correct = data.is_correct ? 1 : 0;
        }
        renderDailyQuestions(qs);
        // 更新统计
        const answered = qs.filter(x => x.user_answer).length;
        const correct = qs.filter(x => x.is_correct === 1).length;
        renderDailyStats(answered, correct, qs.length);
    });
}

function showWrongAnswers() {
    const container = document.getElementById('dailyWrongList');
    container.style.display = 'block';
    container.innerHTML = '<p style="color:#8a93a7;">加载中...</p>';
    
    fetchWithSession('/api/daily/wrong')
        .then(r => r.json())
        .then(data => {
            if (data.length === 0) {
                container.innerHTML = '<p style="color:#10b981;">暂无错题，继续保持!</p>';
                return;
            }
            
            let html = '<h3 style="font-size:16px;margin-bottom:12px;">错题本</h3>';
            data.forEach(wrong => {
                html += `<div class="quiz-question-box" style="margin-bottom:12px;border-left:3px solid #ef4444;">
                    <div class="q-text">${wrong.question}</div>
                    <div style="margin-top:8px;font-size:14px;">
                        <span style="color:#ef4444;">你的答案: ${wrong.user_answer}</span> |
                        <span style="color:#10b981;">正确答案: ${wrong.correct_answer}</span>
                    </div>
                    <div style="margin-top:8px;color:#5a6a7e;font-size:14px;">${wrong.explanation}</div>
                    ${!wrong.reviewed ? `<button class="btn btn-outline" style="margin-top:8px;" onclick="markWrongAsReviewed(${wrong.id})"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 标记已复习</button>` : '<span style="color:#10b981;font-size:14px;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已复习</span>'}
                </div>`;
            });
            
            container.innerHTML = html;
        });
}

function markWrongAsReviewed(wrongId) {
    fetchWithSession('/api/daily/wrong/review', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({wrong_id: wrongId})
    })
    .then(r => r.json())
    .then(data => {
        showWrongAnswers();
    });
}

    }
}

function loadKnowledgePractice(category) {
    // 如果切换了分类，清空已做题列表
    if (category !== undefined && category !== currentKnowledgeCategory) {
        knowledgeAnsweredIds = [];
        knowledgeRoundDone = false;
    }
    
    if (category !== undefined) {
        currentKnowledgeCategory = category;
        const tabs = document.querySelectorAll('#knowledgeCategoryTabs .tab');
        tabs.forEach(t => t.classList.toggle('active', t.dataset.cat === category));
    }
    
    // 获取题库总数
    fetchWithSession('/api/knowledge/stats')
    .then(r => r.json())
    .then(stats => {
        const container = document.getElementById('knowledgeQuestionsList');
        let categoryInfo = currentKnowledgeCategory === 'all' ? '全部题库' : currentKnowledgeCategory;
        
        // 显示统计信息面板
        let statsHtml = `
            <div style="background:#f0f4fe;border-radius:8px;padding:12px;margin-bottom:16px;">
                <div style="font-size:14px;color:#5a6a7e;margin-bottom:8px;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> 每题最多可做3次</div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div style="font-size:14px;color:#1a2332;">
                        <strong>${categoryInfo}</strong>：已完成 <strong style="color:#10b981;">${stats.total_answered}</strong> 题，正确 <strong style="color:#10b981;">${stats.total_correct}</strong> 题，正确率 <strong style="color:#f59e0b;">${stats.accuracy}%</strong>
                    </div>
                </div>
            </div>
        `;
        container.innerHTML = statsHtml;
        
        // 加载练习题（单题模式：一次加载1题）
        fetchWithSession('/api/knowledge/practice?category=' + encodeURIComponent(currentKnowledgeCategory) + '&limit=1&exclude_ids=' + knowledgeAnsweredIds.join(','))
        .then(r => r.json())
        .then(data => {
            knowledgeQuestions = data.questions;
            currentQuestionIndex = 0;
            
            // 检查是否所有题目都已刷完
            if (data.all_done || (data.total === 0 && knowledgeAnsweredIds.length > 0)) {
                container.innerHTML += `
                    <div style="text-align:center;padding:40px 20px;background:#f0f4fe;border-radius:12px;margin-top:16px;">
                        <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
                        <div style="font-size:18px;font-weight:600;color:#1a2332;margin-bottom:8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg> 本分类题目已刷完！</div>
                        <div style="font-size:14px;color:#5a6a7e;margin-bottom:20px;">本轮已完成 <strong style="color:#10b981;">${knowledgeAnsweredIds.length}</strong> 道题</div>
                        <button class="btn btn-primary" onclick="resetKnowledgeRound()">
                            <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> 重新开始刷题
                        </button>
                    </div>
                `;
                knowledgeRoundDone = true;
                return;
            }
            
            // 显示进度信息
            let progressInfo = '';
            if (data.total_count > 0) {
                let remaining = data.total_count - knowledgeAnsweredIds.length;
                progressInfo = `<span style="font-size:12px;color:#8a93a7;">剩余 <strong style="color:#10b981;">${remaining}</strong> 题未做</span>`;
            }
            
            // 单题模式提示
            let questionHeader = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <div style="font-size:14px;color:#8a93a7;">${progressInfo}</div>
                    <button class="btn btn-outline" onclick="loadKnowledgePractice()"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg> 换一题</button>
                </div>
            `;
            container.innerHTML += questionHeader;
            
            renderKnowledgeQuestions();
        });
    });
}

function renderKnowledgeQuestions() {
    const container = document.getElementById('knowledgeQuestionsList');
    if (knowledgeQuestions.length === 0) {
        container.innerHTML = '<p style="color:#8a93a7;text-align:center;">暂无题目，请先运行爬虫抓取题库</p>';
        return;
    }
    
    // 单题模式：只渲染当前题
    const q = knowledgeQuestions[currentQuestionIndex];
    if (!q) return;
    
    let html = `<div class="quiz-question-box" style="margin-bottom:16px;">
        <div class="q-title" style="display:flex;justify-content:space-between;align-items:center;">
            <span>题目 ${currentQuestionIndex + 1} / ${knowledgeQuestions.length} <span style="font-size:12px;color:#8a93a7;">[${q.category}]</span></span>
            <div style="display:flex;gap:8px;">
                <button class="btn btn-outline" style="padding:4px 12px;font-size:12px;" onclick="auditQuestion(${q.id}, this)">
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2m0 2v2m0-2h2m-2 0h-2M8 2h2m-2 0H6m2 0v2m0-2v2m-6 7h2m-2 0H4m2 0v2m0-2v2m12-2h2m-2 0h-2m2 0v2m0-2v-2"/><circle cx="13" cy="13" r="6"/></svg> 检查修复
                </button>
                <button class="btn btn-danger" style="padding:4px 12px;font-size:12px;" onclick="deleteQuestion(${q.id}, this)">
                    <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> 删除
                </button>
            </div>
        </div>
        <div class="q-text">${q.question}</div>
        <div style="margin-top:12px;">`;
    
    q.options.forEach(opt => {
        const optLetter = String.fromCharCode(65 + q.options.indexOf(opt));
        // 选项文本可能已带 A./B. 前缀，去掉避免重复
        let optText = String(opt).trim();
        const prefix = optLetter + '.';
        if (optText.startsWith(prefix)) {
            optText = optText.substring(prefix.length).trim();
        }
        html += `<button class="btn btn-outline" style="margin:4px;width:100%;justify-content:flex-start;text-align:left;" onclick="submitKnowledgeAnswer(${q.id}, '${optLetter}', this)">${optLetter}. ${optText}</button>`;
    });
    
    html += `</div><div id="knowledge-feedback-${q.id}" style="margin-top:12px;"></div></div>`;
    
    // 导航：上一题/下一题（下一题在已答题后可用）
    html += `<div class="quiz-nav" style="margin-top:12px;">
        <button class="btn btn-outline" ${currentQuestionIndex === 0 ? 'disabled' : ''} onclick="prevKnowledgeQuestion()"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> 上一题</button>
        <span class="quiz-progress">${currentQuestionIndex + 1} / ${knowledgeQuestions.length}</span>
        <button class="btn btn-outline" ${currentQuestionIndex >= knowledgeQuestions.length - 1 ? 'disabled' : ''} onclick="nextKnowledgeQuestion()">下一题 <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>`;
    
    container.innerHTML += html;
}

// 知识题库：上一题
function prevKnowledgeQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        // 重新加载（去掉已渲染的旧题）
        const container = document.getElementById('knowledgeQuestionsList');
        // 保留统计信息（第一个子元素）
        container.innerHTML = container.querySelector('div:first-child') ? container.children[0].outerHTML : '';
        renderKnowledgeQuestions();
    }
}

// 知识题库：下一题
function nextKnowledgeQuestion() {
    if (currentQuestionIndex < knowledgeQuestions.length - 1) {
        currentQuestionIndex++;
        const container = document.getElementById('knowledgeQuestionsList');
        container.innerHTML = container.children[0] ? container.children[0].outerHTML : '';
        renderKnowledgeQuestions();
    }
}

function auditQuestion(questionId, btn) {
    const originalText = btn.innerHTML;
    btn.innerHTML = '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-dasharray="30 70" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"/></circle></svg> 检查中...';
    btn.disabled = true;
    
    fetchWithSession('/api/knowledge/audit/' + questionId, {method: 'POST'})
    .then(r => r.json())
    .then(result => {
        btn.innerHTML = originalText;
        btn.disabled = false;
        
        if (result.success) {
            if (result.fixed) {
                alert('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><polyline points="20 6 9 17 4 12"/></svg> 修复成功\n\n问题：' + (result.issues || []).join(', ') + '\n修复说明：' + (result.fix_summary || ''));
                // 重新加载题目列表
                loadKnowledgePractice();
            } else {
                alert('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><polyline points="20 6 9 17 4 12"/></svg> ' + result.message);
            }
        } else {
            alert('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 审计失败\n\n' + result.message);
        }
    })
    .catch(err => {
        btn.innerHTML = originalText;
        btn.disabled = false;
        alert('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 请求失败: ' + err.message);
    });
}

function deleteQuestion(questionId, btn) {
    if (!confirm('确定要删除这道题吗？删除后无法恢复。')) {
        return;
    }
    
    fetchWithSession(`/api/knowledge/question/${questionId}`, {
        method: 'DELETE'
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            alert('删除失败：' + data.error);
            return;
        }
        
        // 从当前列表中移除该题目
        knowledgeQuestions = knowledgeQuestions.filter(q => q.id !== questionId);
        
        // 重新渲染列表
        renderKnowledgeQuestions();
        
        // 显示成功提示
        const feedbackDiv = document.getElementById('knowledgeQuestionsList');
        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:12px 24px;border-radius:8px;z-index:10000;';
        toast.textContent = '题目已删除';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    })
    .catch(error => {
        console.error('删除题目失败:', error);
        alert('删除失败，请重试');
    });
}

function submitKnowledgeAnswer(questionId, answer, btn) {
    fetchWithSession('/api/knowledge/answer', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question_id: questionId, answer: answer})
    })
    .then(r => r.json())
    .then(data => {
        const feedbackEl = document.getElementById('knowledge-feedback-' + questionId);
        const q = knowledgeQuestions.find(q => q.id === questionId);
        
        let html = '';
        if (data.is_correct) {
            html += '<span style="color:#10b981;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 回答正确!</span>';
            btn.style.background = '#10b981';
            btn.style.color = 'white';
        } else {
            html += `<span style="color:#ef4444;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 回答错误，正确答案是 ${data.correct_answer}</span>`;
            btn.style.background = '#ef4444';
            btn.style.color = 'white';
        }
        
        if (q && q.explanation) {
            html += `<div style="margin-top:8px;color:#5a6a7e;font-size:14px;">${q.explanation}</div>`;
        }
        
        if (q && q.source) {
            html += `<div style="margin-top:8px;font-size:12px;color:#8a93a7;">来源: ${q.source}</div>`;
        }
        
        feedbackEl.innerHTML = html;
        
        // Disable all buttons for this question
        const parentBox = btn.parentElement;
        const allBtns = parentBox.querySelectorAll('button');
        allBtns.forEach(b => b.disabled = true);
        
        // Record this question as answered
        if (!knowledgeAnsweredIds.includes(questionId)) {
            knowledgeAnsweredIds.push(questionId);
        }
        
        // 单题模式：答完自动加载下一题（1.5秒后）
        setTimeout(function() {
            // 如果当前还有未答的题（在本批中），先切下一题；否则加载新的一题
            if (currentQuestionIndex < knowledgeQuestions.length - 1) {
                nextKnowledgeQuestion();
            } else {
                loadKnowledgePractice();
            }
        }, 1500);
    });
}

function showKnowledgeWrong(category) {
    const container = document.getElementById('knowledgeWrongList');
    container.style.display = 'block';
    container.innerHTML = '<p style="color:#8a93a7;">加载中...</p>';
    
    let url = '/api/knowledge/wrong';
    if (category && category !== 'all') {
        url += '?category=' + encodeURIComponent(category);
    }

// 重新开始刷题：清空已做题记录
function resetKnowledgeRound() {
    knowledgeAnsweredIds = [];
    loadKnowledgePractice();
}
    
    fetchWithSession(url)
        .then(r => r.json())
        .then(data => {
            if (data.length === 0) {
                container.innerHTML = '<p style="color:#10b981;">暂无错题，继续保持!</p>';
                return;
            }
            
            const totalWrong = data.length;
            const reviewedCount = data.filter(w => w.reviewed).length;
            
            let html = `
                <div style="background:#f0f4fe;padding:12px;border-radius:8px;margin-bottom:16px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <span style="color:#1a2332;font-weight:600;">错题本统计</span>
                        <span style="color:#8a93a7;font-size:14px;">共 <strong style="color:#ef4444;">${totalWrong}</strong> 道错题，已复习 <strong style="color:#10b981;">${reviewedCount}</strong> 道</span>
                    </div>
                </div>
                <h3 style="font-size:16px;margin-bottom:12px;">错题列表</h3>
            `;
            data.forEach(wrong => {
                html += `<div class="quiz-question-box" style="margin-bottom:12px;border-left:3px solid #ef4444;">
                    <div class="q-title" style="font-size:14px;color:#8a93a7;">[${wrong.category}]</div>
                    <div class="q-text">${wrong.question}</div>
                    <div style="margin-top:8px;font-size:14px;">
                        <span style="color:#ef4444;">你的答案: ${wrong.user_answer}</span> |
                        <span style="color:#10b981;">正确答案: ${wrong.correct_answer}</span>
                    </div>
                    ${wrong.explanation ? `<div style="margin-top:8px;color:#5a6a7e;font-size:14px;">${wrong.explanation}</div>` : ''}
                    <div style="margin-top:8px;font-size:12px;color:#8a93a7;">来源: ${wrong.source}</div>
                    ${!wrong.reviewed ? `<button class="btn btn-outline" style="margin-top:8px;" onclick="markKnowledgeWrongAsReviewed(${wrong.id})"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 标记已复习</button>` : '<span style="color:#10b981;font-size:14px;"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已复习</span>'}
                </div>`;
            });
            
            container.innerHTML = html;
        });
}

function markKnowledgeWrongAsReviewed(wrongId) {
    fetchWithSession('/api/knowledge/wrong/review', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({wrong_id: wrongId})
    })
    .then(r => r.json())
    .then(data => {
        // 显示成功反馈
        alert('已标记为已复习');
        showKnowledgeWrong();
    });
}

function showQuestionSelector(category) {
    // 打开全屏浏览界面
    document.getElementById('knowledgeBrowser').classList.add('show');
    document.getElementById('browserTitle').textContent = category + '题库';
    
    // 加载该分类的所有题目
    fetchWithSession('/api/knowledge/list?category=' + encodeURIComponent(category))
    .then(r => r.json())
    .then(data => {
        renderQuestionsList(data);
        renderQuestionsNav(data);
    });
}

function renderQuestionsList(questions) {
    const list = document.getElementById('questionsList');
    let html = '';
    questions.forEach((q, index) => {
        html += `<div class="question-item" id="question-${index}">
            <div class="q-num">第 ${index + 1} 题</div>
            <div class="q-title">${q.question}</div>
            <div class="q-text">
                ${q.options.map((opt, i) => `<div>${String.fromCharCode(65 + i)}. ${opt}</div>`).join('')}
            </div>
            <div class="q-meta">来源: ${q.source || '未知'} | 难度: ${q.difficulty || '中等'}</div>
        </div>`;
    });
    list.innerHTML = html;
}

function renderQuestionsNav(questions) {
    const nav = document.getElementById('questionsNav');
    let html = '';
    
    // If there are more than 20 questions, show grouped navigation
    if (questions.length > 20) {
        // Show key numbers: 1, then every 10th, then last
        const keyIndices = [0]; // Always show first
        for (let i = 9; i < questions.length - 1; i += 10) {
            keyIndices.push(i);
        }
        keyIndices.push(questions.length - 1); // Always show last
        
        keyIndices.forEach(index => {
            html += `<div class="nav-item" onclick="scrollToQuestion(${index})" title="第 ${index + 1} 题">${index + 1}</div>`;
        });
    } else {
        // Show all numbers
        questions.forEach((q, index) => {
            html += `<div class="nav-item" onclick="scrollToQuestion(${index})" title="第 ${index + 1} 题">${index + 1}</div>`;
        });
    }
    
    nav.innerHTML = html;
}

function scrollToQuestion(index) {
    const questionEl = document.getElementById('question-' + index);
    if (questionEl) {
        // 滚动到题目
        questionEl.scrollIntoView({behavior: 'smooth', block: 'start'});
        
        // 移除所有active状态
        document.querySelectorAll('.questions-nav .nav-item').forEach(item => {
            item.classList.remove('active');
        });
        
        // 添加active状态到当前导航项
        const navItems = document.querySelectorAll('.questions-nav .nav-item');
        if (navItems[index]) {
            navItems[index].classList.add('active');
        }
        
        // 高亮显示3秒
        questionEl.classList.add('highlight');
        setTimeout(() => {
            questionEl.classList.remove('highlight');
        }, 3000);
    }
}

function closeKnowledgeBrowser() {
    document.getElementById('knowledgeBrowser').classList.remove('show');
}

<script>
/* 主题：跟随系统深/浅色（无按钮）。系统切深色→自动变暗，切浅色→自动变亮。 */
(function(){
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function apply(dark){ document.documentElement.classList.toggle('dark', !!dark); }
  apply(mq ? mq.matches : true);
  if(mq){
    var onChange = function(e){ apply(e.matches); };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }
})();
</script>
<script>
/* ==== 图片灯箱: 点击预览/题目图片全屏查看, 双指缩放/双击放大/拖动平移/左右滑动切图 ==== */
(function(){
  var SEL='.preview-modal .image-content img,.preview-modal .image-list .image-item img,.q-images img,.rgx-browsescroll .rgx-browse-img';
  var lb=null,imgEl=null,cntEl=null,nameEl=null,navPrev=null,navNext=null;
  var list=[],idx=0,showing=false;
  var vw=0,vh=0,iw=0,ih=0,base=1,z=1,tx=0,ty=0;
  var pointers={},pn=0,gesture=null,down=null,lastPan=null;
  var lastTap=0,tapTimer=null,chromeTimer=null;

  function dist(a,b){return Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));}
  function apply(){imgEl.style.transform='translate('+tx+'px,'+ty+'px) scale('+z+')';}
  function clampT(){
    var w=iw*z,h=ih*z;
    tx=(w<=vw)?(vw-w)/2:Math.min(0,Math.max(vw-w,tx));
    ty=(h<=vh)?(vh-h)/2:Math.min(0,Math.max(vh-h,ty));
  }
  function fit(){z=base;tx=(vw-iw*z)/2;ty=(vh-ih*z)/2;apply();}
  function showChrome(on){
    if(on){lb.classList.remove('hide-chrome');clearTimeout(chromeTimer);chromeTimer=setTimeout(function(){lb.classList.add('hide-chrome');},3000);}
    else lb.classList.add('hide-chrome');
  }
  function build(){
    if(lb)return;
    lb=document.createElement('div');lb.className='img-lightbox';
    lb.innerHTML='<img class="lb-img" alt="">'+
      '<div class="lb-bar"><span class="lb-count"></span><span class="lb-name"></span>'+
      '<button class="lb-x" aria-label="\u5173\u95ed"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>'+
      '<button class="lb-nav lb-prev" aria-label="\u4e0a\u4e00\u5f20">\u2039</button>'+
      '<button class="lb-nav lb-next" aria-label="\u4e0b\u4e00\u5f20">\u203a</button>';
    document.body.appendChild(lb);
    imgEl=lb.querySelector('.lb-img');
    cntEl=lb.querySelector('.lb-count');
    nameEl=lb.querySelector('.lb-name');
    navPrev=lb.querySelector('.lb-prev');
    navNext=lb.querySelector('.lb-next');
    lb.querySelector('.lb-x').addEventListener('click',function(e){e.stopPropagation();close();});
    navPrev.addEventListener('click',function(e){e.stopPropagation();go(-1);});
    navNext.addEventListener('click',function(e){e.stopPropagation();go(1);});
    lb.addEventListener('pointerdown',onDown);
    lb.addEventListener('pointermove',onMove);
    lb.addEventListener('pointerup',onUp);
    lb.addEventListener('pointercancel',onUp);
    lb.addEventListener('wheel',onWheel,{passive:false});
    window.addEventListener('keydown',function(e){
      if(!showing)return;
      if(e.key==='Escape')close();
      else if(e.key==='ArrowLeft'&&list.length>1)go(-1);
      else if(e.key==='ArrowRight'&&list.length>1)go(1);
    });
    window.addEventListener('resize',function(){
      if(showing&&iw){vw=lb.clientWidth;vh=lb.clientHeight;base=Math.min(vw/iw,vh/ih);if(z<=base*1.01)fit();else{clampT();apply();}}
    });
  }
  function loadIdx(){
    var item=list[idx];
    imgEl.onload=function(){
      iw=imgEl.naturalWidth||800;ih=imgEl.naturalHeight||600;
      vw=lb.clientWidth;vh=lb.clientHeight;
      base=Math.min(vw/iw,vh/ih);
      fit();
    };
    imgEl.src=item.src;
    cntEl.textContent=(idx+1)+' / '+list.length;
    nameEl.textContent=item.name||'';
    for(var d=1;d<=1;d++){
      var nx=list[(idx+d)%list.length];
      if(nx&&nx.src&&!nx._pre){var pre=new Image();pre.src=nx.src;nx._pre=true;}
    }
  }
  function open(imgs,i){
    build();
    list=imgs;idx=i;showing=true;
    lb.classList.add('show');lb.classList.remove('hide-chrome');
    if(list.length<2)lb.classList.add('one');else lb.classList.remove('one');
    pointers={};pn=0;gesture=null;down=null;lastPan=null;
    loadIdx();showChrome(true);
  }
  function close(){showing=false;lb.classList.remove('show');imgEl.src='';}
  function go(d){
    if(list.length<2)return;
    idx=(idx+d+list.length)%list.length;
    gesture=null;down=null;lastPan=null;
    loadIdx();
  }
  function inImg(x,y){return x>=tx&&x<=tx+iw*z&&y>=ty&&y<=ty+ih*z;}
  function pList(){var p=[];for(var k in pointers)p.push(pointers[k]);return p;}
  function onDown(e){
    if(e.target!==lb)return; /* 按钮/装饰层不拦截 */
    try{lb.setPointerCapture(e.pointerId);}catch(err){}
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    pn++;
    if(pn===1){down={x:e.clientX,y:e.clientY,t:Date.now(),moved:false};lastPan={x:e.clientX,y:e.clientY};}
    else if(pn===2){
      var p=pList();var mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
      gesture={d0:Math.max(1,dist(p[0],p[1])),z0:z,wx:(mx-tx)/z,wy:(my-ty)/z};
      down=null;lastPan=null;
    }
    e.preventDefault();
  }
  function onMove(e){
    if(!(e.pointerId in pointers))return;
    pointers[e.pointerId].x=e.clientX;pointers[e.pointerId].y=e.clientY;
    if(down&&(Math.abs(e.clientX-down.x)>8||Math.abs(e.clientY-down.y)>8))down.moved=true;
    if(pn>=2&&gesture){
      var p=pList();
      var nz=Math.min(base*6,Math.max(base,gesture.z0*dist(p[0],p[1])/gesture.d0));
      var mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
      z=nz;tx=mx-gesture.wx*z;ty=my-gesture.wy*z;
      clampT();apply();e.preventDefault();
    }else if(pn===1&&down&&z>base*1.02&&lastPan){
      tx+=e.clientX-lastPan.x;ty+=e.clientY-lastPan.y;
      lastPan={x:e.clientX,y:e.clientY};
      clampT();apply();e.preventDefault();
    }
  }
  function onUp(e){
    if(!(e.pointerId in pointers))return;
    delete pointers[e.pointerId];pn=Math.max(0,pn-1);
    if(pn===1){ /* 双指变单指: 重置平移基准 */
      var p=pList();lastPan=p[0]?{x:p[0].x,y:p[0].y}:null;gesture=null;down=null;
    }else if(pn===0){
      if(down){
        var now=Date.now(),dt=now-down.t;
        var dx=e.clientX-down.x,dy=e.clientY-down.y;
        var swipe=down.moved&&dt<500&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&z<=base*1.02;
        if(!down.moved&&dt<300){
          if(now-lastTap<350){
            clearTimeout(tapTimer);tapTimer=null;lastTap=0;
            if(z>base*1.1){fit();}
            else{
              var wx=(e.clientX-tx)/z,wy=(e.clientY-ty)/z;
              z=base*2.6;tx=e.clientX-wx*z;ty=e.clientY-wy*z;clampT();apply();
            }
            showChrome(true);
          }else{
            lastTap=now;
            (function(px,py,now2){
              tapTimer=setTimeout(function(){
                if(lastTap===now2){
                  if(inImg(px,py)){showChrome(lb.classList.contains('hide-chrome'));}
                  else close();
                }
              },360);
            })(e.clientX,e.clientY,now);
          }
        }else if(swipe){go(dx<0?1:-1);}
      }
      down=null;lastPan=null;
    }
  }
  function onWheel(e){
    if(!showing)return;
    e.preventDefault();
    var f=e.deltaY<0?1.15:1/1.15;
    var nz=Math.min(base*6,Math.max(base,z*f));
    var wx=(e.clientX-tx)/z,wy=(e.clientY-ty)/z;
    z=nz;tx=e.clientX-wx*z;ty=e.clientY-wy*z;clampT();apply();
  }

  /* 全局委托: 点击预览/题目中的图片打开灯箱 */
  document.addEventListener('click',function(e){
    var t=e.target;
    if(!t||t.tagName!=='IMG')return;
    if(lb&&lb.contains(t))return;
    if(!t.matches||!t.matches(SEL))return;
    var scope=null;
    if(t.closest){scope=t.closest('.preview-body')||t.closest('.quiz-question-box')||t.closest('.rgx-browsescroll');}
    var imgs=scope?Array.prototype.slice.call(scope.querySelectorAll(SEL)).filter(function(im){return im.src;}):[];
    var i=imgs.indexOf(t);
    if(i<0){imgs=[{src:t.src,name:t.alt||''}];i=0;}
    else{imgs=imgs.map(function(im){return {src:im.src,name:im.alt||''};});}
    open(imgs,i);
  });
})();
</script>
</body>
