<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
body{background:#0b1120;min-height:100vh}
.login-box{max-width:400px;margin:14vh auto;background: linear-gradient(160deg,#111b30,#0d1526);border:1px solid #1e293b;border-radius:20px;padding:36px 34px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.lgo{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#38bdf8,#818cf8);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 10px 30px rgba(56,189,248,.3)}
h1{color:#f8fafc;font-size:21px;margin-bottom:8px}
p{color:#94a3b8;font-size:13px;margin:0 auto 22px;line-height:1.6;max-width:300px}
.field{text-align:left;margin-bottom:12px}
.field label{display:block;color:#94a3b8;font-size:12px;margin-bottom:5px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px;outline:none;transition:.15s}
input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;margin-top:8px}
button:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(56,189,248,.3)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.login-err{color:#ef4444;font-size:12px;margin-top:12px;min-height:18px;line-height:1.5}
.lock-tip{color:#f59e0b;font-size:13px;margin-top:10px;min-height:18px;font-weight:500}
.hint{margin-top:20px;font-size:11px;color:#475569;line-height:1.8}
.count{font-size:12px;color:#94a3b8;margin-top:6px;min-height:16px}
fieldset{border:none;padding:0;margin:0}
.link{display:inline-block;margin-top:10px;font-size:11px;color:#38bdf8;opacity:.7;text-decoration:none;cursor:default}
/* 白昼模式 */
html.light body{background:#eef1f4}
html.light .login-box{background:linear-gradient(160deg,#ffffff,#f5f7fa);border:1px solid rgba(90,110,130,.25);box-shadow:0 24px 70px rgba(30,50,70,.12)}
html.light h1{color:#1c2a3a}
html.light p, html.light .field label, html.light .count, html.light .hint{color:#5a6a7e}
html.light input{background:#fff;border:1px solid rgba(90,110,130,.3);color:#1c2a3a}
html.light input:focus{border-color:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.15)}
/* 主题切换按钮 */
.theme-toggle{position:fixed;top:16px;right:16px;z-index:999;width:36px;height:36px;border-radius:50%;border:1px solid rgba(128,128,128,.4);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;background:rgba(128,128,128,.15);color:#dbe0e6}
html.light .theme-toggle{background:rgba(90,110,130,.12);color:#334155}
</style>
</head>
<body>
<button class="theme-toggle" id="svcTheme" title="日/夜模式" aria-label="切换日间/夜间模式">🌙</button>
<div class="login-box">
  <div class="lgo">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <h1>欢迎回来</h1>
  <form onsubmit="doLogin();return false;">
    <div class="field"><label for="user">用户名</label>
      <input id="user" placeholder="用户名" autocomplete="username" autofocus></div>
    <div class="field"><label for="pw">密码</label>
      <input type="password" id="pw" placeholder="密码" autocomplete="current-password"></div>
    <button id="lb" type="submit">登 录</button>
  </form>
  <div class="login-err" id="err"></div>
  <div class="lock-tip" id="lockTip"></div>
  <div class="count" id="count">—</div>
  <div class="hint">家人没有账号？点下方注册（注册后需家长确认激活）</div>
  <a class="link" href="/family/register" style="cursor:pointer">＋ 注册新家人账号</a>
</div>
<script>
/* 日/夜切换：默认深色，记住选择 */
(function(){
  var KEY='svcctrl_theme';
  var saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
  var isDark = saved!=='light';
  function paint(){
    var d=document.documentElement;
    d.classList.toggle('dark', isDark); d.classList.toggle('light', !isDark);
    var btn=document.getElementById('svcTheme');
    if(btn) btn.textContent = isDark? '🌙':'☀️';
  }
  paint();
  var btn=document.getElementById('svcTheme');
  if(btn) btn.addEventListener('click', function(){
    isDark=!isDark; try{ localStorage.setItem(KEY, isDark?'dark':'light'); }catch(e){}
    paint();
  });
})();
var E=function(id){return document.getElementById(id);};
// 初次加载: 查询是否已被锁
refreshLock();
var countTimer=null;

async function refreshLock(){
  try{
    var r=await fetch('/api/lockstate');
    var d=await r.json();
    if(d.locked){ renderLockTimer(d.remain); }
    else updateCount(d.left);
  }catch(e){}
}
function updateCount(left){
  var c=E('count');
  if(left>=3){ c.textContent='—'; }
  else if(left>0){ c.textContent='已尝试失败，剩余还可尝试 '+left+' 次'; }
  else{ c.textContent=''; }
  if(left<=0){ E('count').style.color='#f59e0b'; }
}
function renderLockTimer(remain){
  var lt=E('lockTip'), c=E('count'), b=E('lb');
  b.disabled=true; lt.textContent='';
  c.textContent='已达到尝试上限，锁定中…';
  c.style.color='#ef4444';
  startLockCountdown(remain);
}
function startLockCountdown(remain){
  if(countTimer) clearInterval(countTimer);
  function tick(){
    var r=remain>0?remain:0;
    var m=Math.floor(r/60), s=r%60;
    E('lockTip').textContent='已锁定，剩余 '+m+' 分 '+s+' 秒后可重试';
    E('lb').disabled=r>0;
    if(r<=0){ clearInterval(countTimer); E('err').textContent='可以重试了'; refreshLock(); return; }
    remain--;
  }
  tick(); countTimer=setInterval(tick,1000);
}

async function doLogin(){
  var user=E('user').value.trim(), pw=E('pw').value;
  var err=E('err'), lt=E('lockTip');
  var b=E('lb');
  err.textContent=''; lt.textContent='';
  if(!user||!pw){ err.textContent='请输入用户名和密码'; return; }
  b.disabled=true; var old=b.textContent; b.textContent='验证中…';
  try{
    var r=await fetch('/api/login_unified',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:user,password:pw})});
    var d=await r.json();
    if(d.ok){ location.href=d.redirect||'/'; return; }
    b.disabled=false; b.textContent='进入控制台';
    if(d.locked){ err.textContent=''; startLockCountdown(d.remain||3600); }
    else { err.textContent=d.error||'登录失败'; updateCount(d.left!==undefined?d.left:3); }
  }catch(e){ err.textContent='请求失败，请重试'; b.disabled=false; b.textContent='进入控制台'; }
}
</script>
</body>
</html>
