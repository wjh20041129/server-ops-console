<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👨‍🍳 专属厨房后台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#f4f5f7; color:#2d2d2d; }
  .wrap { max-width:900px; margin:0 auto; padding:20px; }

  /* 登录 */
  #loginPage { display:flex; align-items:center; justify-content:center; min-height:80vh; }
  .login-box { background:#fff; border-radius:16px; padding:40px; width:100%; max-width:360px;
               box-shadow:0 4px 20px rgba(0,0,0,.08); text-align:center; }
  .login-box h1 { font-size:22px; margin-bottom:8px; }
  .login-box .desc { color:#9a9a9a; font-size:13px; margin-bottom:24px; }
  .login-box input { width:100%; padding:12px 14px; border:1px solid #ddd; border-radius:10px;
                     font-size:15px; margin-bottom:14px; outline:none; }

  .login-box input:focus { border-color:#0ea86a; }
  .login-box button { width:100%; padding:13px; border:none; border-radius:10px; background:#0ea86a;
                      color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .login-box .err { color:#d33; font-size:13px; margin-top:10px; }

  /* 主界面 */
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .topbar h1 { font-size:20px; }
  .topbar .acts { display:flex; gap:8px; }
  .btn { border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-primary { background:#0ea86a; color:#fff; }
  .btn-ghost { background:#fff; color:#555; border:1px solid #ddd; }
  .btn-danger { background:#e74c3c; color:#fff; }
  .btn-sm { padding:5px 10px; font-size:12px; border-radius:6px; }

  .card { background:#fff; border-radius:14px; padding:18px; margin-bottom:18px;
          box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .card h2 { font-size:16px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .card h2 .hint { font-size:12px; color:#9a9a9a; font-weight:400; }

  /* 订单 */
  .order { border:1px solid #eee; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .order-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .order-id { font-weight:700; }
  .who { font-size:12px; color:#0d47a1; background:#e8f0fe; border-radius:10px; padding:1px 8px; font-weight:600; }
  .order-time { color:#9a9a9a; font-size:12px; }
  .order-items { font-size:14px; line-height:1.7; }
  .order-note { color:#a5804a; font-size:13px; margin-top:4px; background:#fdf6e9; padding:4px 8px;
                border-radius:6px; display:inline-block; }
  .status { font-size:11px; padding:3px 10px; border-radius:20px; font-weight:600; }
  .status.pending { background:#fff7e0; color:#926d00; }
  .status.cooking { background:#e3f4fb; color:#0e7490; }
  .status.done { background:#e6f6ee; color:#0b8a54; }
  .order-foot { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .empty { color:#9a9a9a; text-align:center; padding:20px; font-size:14px; }

  /* 菜品 */
  .dish-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .dish-card { border:1px solid #eee; border-radius:10px; overflow:hidden; }
  .dish-card img { width:100%; height:90px; object-fit:cover; background:#f3ece3; }
  .dish-card .info { padding:8px 10px; }
  .dish-card .nm { font-size:14px; font-weight:600; }
  .dish-card .cat { font-size:11px; color:#9a9a9a; }
  .dish-card .ops { display:flex; gap:6px; margin-top:8px; }
  .dish-card .ops button { flex:1; }

  /* 表单 */
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-grid .full { grid-column:1/-1; }
  .field label { font-size:12px; color:#666; display:block; margin-bottom:5px; }
  .field input, .field select, .field textarea { width:100%; padding:9px 11px; border:1px solid #ddd;
        border-radius:8px; font-size:14px; outline:none; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color:#0ea86a; }
  .field textarea { resize:vertical; min-height:50px; }
  .field-row { grid-column:1/-1; }
  .photo-wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .photo-prev{width:110px;height:110px;border:2px dashed #e0a68c;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:#fff7f2;position:relative;flex-shrink:0}
  .photo-prev img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-prev span{font-size:12px;color:#c2703f;text-align:center;padding:8px}
  .btn-sm2{padding:8px 12px;font-size:12px}
  html.dark .photo-prev{background:#241f1c;border-color:#5a4438}
  html.dark .photo-prev span{color:#d08b5f}

  /* 标签输入转换提示 */
  .note { font-size:11px; color:#9a9a9a; margin-top:4px; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center;
           justify-content:center; padding:20px; z-index:100; }
  .modal.show { display:flex; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; width:100%; max-width:480px;
               max-height:90vh; overflow:auto; }
  .modal-box h3 { margin-bottom:16px; font-size:17px; }
  .modal-close { float:right; border:none; background:none; font-size:20px; cursor:pointer; color:#9a9a9a; }
  .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff;
           padding:10px 20px; border-radius:8px; font-size:14px; z-index:200; display:none; }

  /* —— 暗夜模式：html.dark 生效，默认暗色；保留品牌橙，字底高对比 —— */
  html.dark{ color-scheme:dark; }
  html.dark body{ background:#14161b; color:#e8eaf0; }
  html.dark .topbar h1, html.dark .card h2, html.dark .card h3, html.dark .modal-box h3, html.dark .login-box h1{ color:#f1f3f7; }
  html.dark .login-box, html.dark .card, html.dark .modal-box{ background:#1f232c; box-shadow:0 2px 14px rgba(0,0,0,.4); }
  html.dark .login-box .desc, html.dark .card h2 .hint{ color:#9aa1ad; }
  html.dark .login-box input, html.dark .field input, html.dark .field select, html.dark .field textarea{
      background:#14171d; color:#e8eaf0; border-color:#3a404b; }
  html.dark .login-box input:focus, html.dark .field input:focus, html.dark .field select:focus,
      html.dark .field textarea:focus{ border-color:#3ddc84; outline:none; }
  html.dark .btn-ghost{ background:#2a303b; color:#dde1e8; border-color:#3a404b; }
  html.dark .btn-ghost:hover{ background:#333a47; }
  html.dark .card h2 .hint{ font-weight:400; }

  /* 订单卡片 */
  html.dark .order, html.dark .dish-card{ background:#232833; border-color:#31363f; }
  html.dark .order-id, html.dark .dish-card .nm{ color:#f1f3f7; }
  html.dark .order-time, html.dark .dish-card .cat, html.dark .field label, html.dark .note,
      html.dark .modal-close, html.dark .empty{ color:#9aa1ad; }
  html.dark .order-note{ background:#332807; color:#eec357; }
  html.dark .who{ background:#1f3a5f; color:#8ec5ff; }
  html.dark .dish-card img{ background:#2a2120; }
  html.dark .status.pending{ background:#4a2c12; color:#ffb066; }
  html.dark .status.cooking{ background:#123349; color:#7fc3ff; }
  html.dark .status.done{ background:#12401f; color:#6fd99a; }
  html.dark .toast{ background:#e8eaf0; color:#14161b; }
  html.dark .modal{ background:rgba(0,0,0,.62); }

  /* 主题切换按钮 */
  .theme-toggle{ position:fixed; top:16px; right:16px; bottom:auto; z-index:500; width:36px; height:36px;
      border-radius:50%; border:1px solid #ddd; background:#fff; color:#2d2d2d; cursor:pointer;
      font-size:16px; display:flex; align-items:center; justify-content:center;
      box-shadow:0 1px 6px rgba(0,0,0,.18); }
  html.dark .theme-toggle{ background:#2a303b; color:#e8eaf0; border-color:#3a404b; }

  /* ====== 塔科夫实验室增强层 (仅暗色生效 · 冷灰金属+荧光绿/冷青) ====== */
  html.dark body{ background:
      radial-gradient(1100px 600px at 80% -10%, rgba(61,220,132,.10), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(56,182,224,.08), transparent 55%),
      #0b0f14; }
  /* 金属玻璃卡片 */
  html.dark .login-box, html.dark .card, html.dark .modal-box{
    background: linear-gradient(160deg, rgba(23,30,40,.72), rgba(14,19,27,.68));
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border:1px solid rgba(90,110,130,.3);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(61,220,132,.05) inset,
                0 8px 40px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.04);
  }
  /* 标题 - 实验室冷白 */
  html.dark .topbar h1, html.dark .card h2, html.dark .card h3, html.dark .modal-box h3, html.dark .login-box h1{
    color:#dce4ea; text-shadow:0 0 12px rgba(61,220,132,.18); letter-spacing:.5px; }
  /* 输入框 - 金属凹槽 */
  html.dark .login-box input, html.dark .field input, html.dark .field select, html.dark .field textarea{
    background:rgba(8,12,18,.75); color:#dfe6ec; border-color:rgba(90,110,130,.4); }
  html.dark .login-box input:focus, html.dark .field input:focus, html.dark .field select:focus,
      html.dark .field textarea:focus{ border-color:#3ddc84; box-shadow:0 0 0 3px rgba(61,220,132,.14); }
  /* 按钮 */
  html.dark .btn-ghost{ background:rgba(23,30,40,.6); color:#bcc8d2; border-color:rgba(90,110,130,.45); }
  html.dark .btn-ghost:hover{ background:rgba(61,220,132,.18); box-shadow:0 0 14px rgba(61,220,132,.25); border-color:#3ddc84; }
  html.dark .btn-primary, html.dark .btn-danger{ border-radius:10px; box-shadow:0 4px 18px rgba(0,0,0,.4); border:1px solid rgba(90,110,130,.35); }
  /* 订单/菜品卡 - 金属玻璃 */
  html.dark .order, html.dark .dish-card{
    background:linear-gradient(160deg, rgba(23,30,40,.65), rgba(14,19,27,.62));
    backdrop-filter: blur(16px) saturate(135%);
    -webkit-backdrop-filter: blur(16px) saturate(135%);
    border:1px solid rgba(90,110,130,.26);
    border-radius:12px;
    box-shadow:0 4px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
  }
  html.dark .order:hover, html.dark .dish-card:hover{ border-color:rgba(61,220,132,.5); box-shadow:0 6px 30px rgba(0,0,0,.5), 0 0 18px rgba(61,220,132,.12); }
  /* 状态光条 - 指示灯 */
  html.dark .status.pending{ background:rgba(246,201,69,.1); color:#f6d98a; border:1px solid rgba(246,201,69,.4); text-shadow:0 0 8px rgba(246,201,69,.3); }
  html.dark .status.cooking{ background:rgba(56,182,224,.1); color:#8fd7ec; border:1px solid rgba(56,182,224,.45); text-shadow:0 0 8px rgba(56,182,224,.3); }
  html.dark .status.done{ background:rgba(61,220,132,.1); color:#9fe8c4; border:1px solid rgba(61,220,132,.4); text-shadow:0 0 8px rgba(61,220,132,.3); }
  /* 是谁下单 - 冷青 */
  html.dark .who{ background:rgba(56,182,224,.12); color:#9fd4ec; border:1px solid rgba(56,182,224,.4); }
  /* 模态遮罩 */
  html.dark .modal{ background:rgba(2,4,8,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  /* 主题切换按钮 - 指示灯 */
  html.dark .theme-toggle{ background:rgba(61,220,132,.12); color:#3ddc84; border-color:rgba(61,220,132,.5); box-shadow:0 0 12px rgba(61,220,132,.22); }
  html.dark .theme-toggle:hover{ background:rgba(61,220,132,.24); box-shadow:0 0 18px rgba(61,220,132,.4); }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" title="日/夜模式" aria-label="切换日间/夜间模式">🌙</button>

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-box">
    <h1>👨‍🍳 厨房后台</h1>
    <div class="desc">专属你的点菜管理 · 需登录</div>
    <input type="password" id="loginPwd" placeholder="输入管理密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登录</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="mainPage" style="display:none">
  <div class="wrap">
    <div class="topbar">
      <h1>🍳 厨房工作台</h1>
      <div class="acts">
        <button class="btn btn-primary" onclick="openAddDish()">＋ 添加新菜</button>
        <button class="btn btn-ghost" onclick="refresh()">刷新</button>
        <button class="btn btn-ghost" onclick="doLogout()">退出</button>
      </div>
    </div>

    <div class="card">
      <h2>📋 最新订单 <span class="hint">(你女朋友点菜后会在这里出现，并邮件通知你)</span></h2>
      <div id="ordersBox"><div class="empty">加载中…</div></div>
    </div>

    <div class="card">
      <h2>📖 菜品管理 <span class="hint">(点击编辑 / 删除)</span></h2>
      <div class="dish-grid" id="dishesBox"></div>
    </div>

    <div class="card">
      <h2>🏷️ 分类管理</h2>
      <div class="form-grid">
        <div class="field">
          <label>新分类名</label>
          <input id="newCatName" placeholder="如：凉菜">
        </div>
        <div class="field">
          <label>图标(emoji)</label>
          <input id="newCatIcon" placeholder="如：🥗">
        </div>
        <div class="field-row">
          <button class="btn btn-primary" onclick="addCategory()">添加分类</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📧 邮件通知设置</h2>
      <div class="form-grid">
        <div class="field">
          <label>QQ邮箱授权码</label>
          <input id="authCode" type="password" placeholder="smtp授权码(非QQ密码)">
        </div>
        <div class="field">
          <label>收件邮箱(通知发到这)</label>
          <input id="recipient" placeholder="you@example.com">
        </div>
        <div class="field-row note">
          授权码获取：QQ邮箱 → 设置 → 账户 → 开启SMTP服务 → 生成授权码。<br>
          保存配置后可点「发送测试邮件」验证。
        </div>
        <div class="field-row" style="display:flex;gap:10px">
          <button class="btn btn-primary" onclick="saveEmail()">保存配置</button>
          <button class="btn btn-ghost" onclick="testEmail()">发送测试邮件</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/编辑菜品弹窗 -->
<div class="modal" id="dishModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="dishModalTitle">添加新菜</h3>
    <input type="hidden" id="dishEditId">
    <div class="form-grid">
      <div class="field">
        <label>菜名 *</label>
        <input id="dName" placeholder="如：麻婆豆腐">
      </div>
      <div class="field">
        <label>分类</label>
        <select id="dCat"></select>
      </div>
      <div class="field">
        <label>图标(emoji，用作占位图)</label>
        <input id="dEmoji" placeholder="如：🌶️">
      </div>
      <div class="field field-row">
        <label>菜品照片（手机点下方按钮，可直接拍照或从相册选图）</label>
        <div class="photo-wrap">
          <div class="photo-prev" id="dPhotoPrev" onclick="pickDishPhoto()">
            <img id="dPhotoImg" style="display:none" alt="">
            <span id="dPhotoTip">点击拍照 / 选图</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button type="button" class="btn btn-ghost btn-sm2" onclick="pickDishPhoto()">拍照/选图</button>
            <button type="button" class="btn btn-ghost btn-sm2" id="dPhotoClear" style="display:none" onclick="clearDishPhoto()">移除照片</button>
          </div>
        </div>
        <input type="file" id="dPhotoFile" accept="image/*" style="display:none">
        <input type="hidden" id="dImage">
        <div class="note">照片自动压缩到 1600px 内；不传照片则沿用 emoji 占位图</div>
      </div>
      <div class="field field-row">
        <label>描述</label>
        <input id="dDesc" placeholder="如：麻辣鲜香，超级下饭">
      </div>
      <div class="field field-row">
        <label>标签 (用逗号分隔)</label>
        <input id="dTags" placeholder="如：微辣,下饭">
        <div class="note">支持：下饭 / 快手 / 甜口 / 微辣 / 硬菜 / 素 / 滋补…</div>
      </div>
      <div class="field-row">
        <button class="btn btn-primary" style="width:100%" onclick="saveDish()">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let TOKEN = localStorage.getItem('menu_admin_token') || '';
let CATS = [];

/* 图片地址相对化，兼容直连 :8090 与 /menu/ 前缀挂载；外链原样返回。 */
function relImg(u){ if(!u) return u; if(/^[a-z][a-z0-9+.-]*:/i.test(u)||u.indexOf('//')===0) return u; return u.replace(/^\/+/,''); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.style.display='none',2500);
}

async function api(path, opts={}){
  path = String(path).replace(/^\/+/,''); // 去头部 / → 相对，兼容直连 :8090 与 /menu/ 前缀挂载
  const headers = {'Content-Type':'application/json'};
  if(TOKEN) headers['Authorization']='Bearer '+TOKEN;
  const res = await fetch(path, {...opts, headers});
  const data = await res.json().catch(()=>({}));
  if(res.status===401 && path!=='api/admin/login'){
    TOKEN=''; localStorage.removeItem('menu_admin_token'); showLogin(true); throw new Error('未登录');
  }
  if(!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

function showLogin(on){
  document.getElementById('loginPage').style.display = on?'flex':'none';
  document.getElementById('mainPage').style.display = on?'none':'block';
  if(on) document.getElementById('loginPwd').value='';
}

async function doLogin(){
  const pwd = document.getElementById('loginPwd').value;
  const err = document.getElementById('loginErr'); err.textContent='';
  try{
    const d = await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:pwd})});
    TOKEN = d.token; localStorage.setItem('menu_admin_token', d.token);
    showLogin(false); refresh();
  }catch(e){ err.textContent = '密码错误'; }
}

function doLogout(){ api('/api/admin/logout',{method:'POST'}).catch(()=>{}); TOKEN='';
  localStorage.removeItem('menu_admin_token'); showLogin(true); }

async function refresh(){
  try{
    const [orders, admin] = await Promise.all([
      api('/api/orders'), api('/api/admin/menu')
    ]);
    renderOrders(orders); CATS = admin.categories; renderDishes(admin);
    loadEmailForm();
  }catch(e){ if(TOKEN) showToast('加载失败: '+e.message); }
}

function fmtTime(ts){ return ts ? String(ts).replace('T',' ').slice(0,16) : ''; }

function renderOrders(orders){
  const box = document.getElementById('ordersBox');
  if(!orders.length){ box.innerHTML='<div class="empty">还没有订单 📭</div>'; return; }
  const statusMap = {pending:['待做','pending'], cooking:['做菜中','cooking'], done:['已做好','done']};
  box.innerHTML = orders.map(o=>{
    const items = (o.items||[]).map(i=>`${i.dish_name} ×${i.quantity}`).join('、');
    const st = statusMap[o.status]||['待做','pending'];
    return `<div class="order">
      <div class="order-head">
        <span class="order-id">订单 #${o.id}</span>
        <span class="who">${o.ordered_by?('👤 '+o.ordered_by):'👤 匿名'}</span>
        <span class="status ${o.status}">${st[0]}</span>
      </div>
      <div class="order-time">${fmtTime(o.created_at)}</div>
      <div class="order-items">${items||'—'}</div>
      ${o.note?`<div class="order-note">📝 备注：${o.note}</div>`:''}
      <div class="order-foot">
        ${o.status==='pending'?`<button class="btn btn-sm btn-primary" onclick="setStatus(${o.id},'cooking')">开始做</button>`:''}
        ${o.status==='cooking'?`<button class="btn btn-sm btn-primary" onclick="setStatus(${o.id},'done')">完成</button>`:''}
        ${o.status!=='pending'?`<button class="btn btn-sm btn-ghost" onclick="setStatus(${o.id},'pending')">重置</button>`:''}
      </div>
    </div>`;
  }).join('');
}

async function setStatus(id, status){
  try{ await api(`/api/orders/${id}/status`,{method:'POST',body:JSON.stringify({status})});
    showToast('已更新'); refresh(); }catch(e){ showToast(e.message); }
}

function renderDishes(admin){
  const byCat = {};
  admin.categories.forEach(c=>byCat[c.id]=c);
  const g = {},
        grid = document.getElementById('dishesBox');
  (admin.dishes||[]).forEach(d=>{ (g[d.category_id]=g[d.category_id]||[]).push(d); });
  let html='';
  admin.categories.forEach(c=>{
    (g[c.id]||[]).forEach(d=>{
      html += `<div class="dish-card">
        <img src="${relImg(d.image)||relImg('/img/dish_'+d.id+'.svg')}" onerror="this.src='${relImg('/img/dish_'+d.id+'.svg')}'">
        <div class="info">
          <div class="nm">${d.emoji} ${d.name}</div>
          <div class="cat">${c.icon} ${c.name}</div>
          <div class="ops">
            <button class="btn btn-sm btn-ghost" onclick="openEditDish(${d.id})">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deleteDish(${d.id},'${d.name}')">删除</button>
          </div>
        </div>
      </div>`;
    });
  });
  grid.innerHTML = html || '<div class="empty" style="grid-column:1/-1">暂无菜品</div>';
}

function openAddDish(){
  document.getElementById('dishModalTitle').textContent='添加新菜';
  document.getElementById('dishEditId').value='';
  ['dName','dDesc','dTags','dImage'].forEach(i=>document.getElementById(i).value='');
  setDishPhoto('');
  document.getElementById('dEmoji').value='🍳';
  fillCatSelect(CATS[0]&&CATS[0].id);
  document.getElementById('dishModal').classList.add('show');
}
function openEditDish(id){
  api('/api/admin/menu').then(admin=>{
    const d = (admin.dishes||[]).find(x=>x.id===id); if(!d) return;
    document.getElementById('dishModalTitle').textContent='编辑：'+d.name;
    document.getElementById('dishEditId').value=d.id;
    document.getElementById('dName').value=d.name;
    document.getElementById('dEmoji').value=d.emoji||'🍳';
    document.getElementById('dImage').value=d.image||'';
    setDishPhoto(d.image||'');
    document.getElementById('dDesc').value=d.description||'';
    document.getElementById('dTags').value=d.tags||'';
    fillCatSelect(d.category_id);
    document.getElementById('dishModal').classList.add('show');
  });
}
function fillCatSelect(sel){
  const s=document.getElementById('dCat');
  s.innerHTML=CATS.map(c=>`<option value="${c.id}" ${c.id==sel?'selected':''}>${c.icon} ${c.name}</option>`).join('');
}
function closeModal(){ document.getElementById('dishModal').classList.remove('show'); }

/* ---------- 菜品照片上传 ---------- */
let _photoBusy = false;
function pickDishPhoto(){ if(!_photoBusy) document.getElementById('dPhotoFile').click(); }
function setDishPhoto(url){
  document.getElementById('dImage').value = url || '';
  const img = document.getElementById('dPhotoImg');
  const tip = document.getElementById('dPhotoTip');
  const clr = document.getElementById('dPhotoClear');
  if (url) { img.src = relImg(url); img.style.display='block'; tip.style.display='none'; clr.style.display=''; }
  else { img.removeAttribute('src'); img.style.display='none'; tip.style.display=''; tip.textContent='\u70b9\u51fb\u62cd\u7167 / \u9009\u56fe'; clr.style.display='none'; }
}
function clearDishPhoto(){ setDishPhoto(''); }
document.getElementById('dPhotoFile').addEventListener('change', async function(){
  const inp = this;
  const f = inp.files && inp.files[0];
  if (!f || _photoBusy) { inp.value = ''; return; }
  if (!/^image\//.test(f.type)) { showToast('\u8bf7\u9009\u62e9\u56fe\u7247\u6587\u4ef6'); return; }
  _photoBusy = true;
  const tip = document.getElementById('dPhotoTip'), img = document.getElementById('dPhotoImg');
  img.style.display='none'; tip.style.display=''; tip.textContent='\u4e0a\u4f20\u4e2d\u2026';
  try{
    const fd = new FormData();
    fd.append('file', f, f.name || 'photo.jpg');
    const qs = TOKEN ? ('?admin_' + 'token=' + encodeURIComponent(TOKEN)) : '';
    const r = await fetch('api/admin/dish/upload' + qs, { method:'POST', body: fd });
    const d = await r.json().catch(()=>({}));
    if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
    setDishPhoto(d.url);
    showToast('\u7167\u7247\u5df2\u4e0a\u4f20');
  }catch(e){
    showToast('\u4e0a\u4f20\u5931\u8d25\uff1a' + (e.message||e));
    setDishPhoto(document.getElementById('dImage').value || '');
  }
  inp.value = '';
  _photoBusy = false;
});

async function saveDish(){
  const id = document.getElementById('dishEditId').value;
  const body = { name: document.getElementById('dName').value.trim(),
    category_id: +document.getElementById('dCat').value,
    emoji: document.getElementById('dEmoji').value.trim()||'🍳',
    image: document.getElementById('dImage').value.trim(),
    description: document.getElementById('dDesc').value.trim(),
    tags: document.getElementById('dTags').value.trim() };
  if(!body.name){ showToast('请输入菜名'); return; }
  try{
    if(id) await api('/api/admin/dish/update',{method:'POST',body:JSON.stringify({...body,id:+id})});
    else await api('/api/admin/dish/add',{method:'POST',body:JSON.stringify(body)});
    showToast('已保存'); closeModal(); refresh();
  }catch(e){ showToast(e.message); }
}

async function deleteDish(id,name){
  if(!confirm(`确定删除「${name}」吗？`)) return;
  try{ await api('/api/admin/dish/delete',{method:'POST',body:JSON.stringify({id})});
    showToast('已删除'); refresh(); }catch(e){ showToast(e.message); }
}

async function addCategory(){
  const name=document.getElementById('newCatName').value.trim();
  const icon=document.getElementById('newCatIcon').value.trim()||'🍽️';
  if(!name){ showToast('请输入分类名'); return; }
  try{ await api('/api/admin/category/add',{method:'POST',body:JSON.stringify({name,icon})});
    showToast('分类已添加'); refresh(); document.getElementById('newCatName').value=''; }catch(e){ showToast(e.message); }
}

// 主题：默认暗色；日/夜切换，记住选择
(function(){
  var KEY='menu_theme';
  var saved = localStorage.getItem(KEY);
  if(saved===null) saved='dark';              // 默认暗色
  var isDark = saved!=='light';
  document.documentElement.classList.toggle('dark', isDark);
  var btn=document.getElementById('themeToggle');
  if(btn){ btn.textContent= isDark? '☀️':'🌙';
    btn.onclick=function(){ isDark=!isDark;
      document.documentElement.classList.toggle('dark', isDark);
      btn.textContent = isDark? '☀️':'🌙';
      try{ localStorage.setItem(KEY, isDark?'dark':'light'); }catch(e){}
    };
    btn.style.zIndex = 999;
  }
})();
